<section class="view" id="view-settings">
  <div class="view-head">
    <div>
      <p class="eyebrow"><span class="eyebrow-dot"></span> Account</p>
      <h1>Manage your <em>account.</em></h1>
      <p class="lede">Profile, notifications and privacy — all in one place.</p>
    </div>
  </div>
  <div class="settings-grid">
    <article class="card settings-card" data-anim="card">
      <div class="card-head"><h3>Profile</h3></div>
      <div class="settings-row">
        <span class="avatar avatar-lg">WL</span>
        <div class="field"><label>Display name</label><input type="text" value="Win Lin Hein" /></div>
        <div class="field"><label>Email</label><input type="email" value="win@example.com" /></div>
      </div>
      <button class="btn-primary" type="button" data-toast="Profile saved (demo) ✓">Save changes</button>
    </article>
    <article class="card settings-card" data-anim="card">
      <div class="card-head"><h3>Notifications</h3></div>
      <label class="switch-row"><span>Scan reminders</span><input type="checkbox" checked /><i></i></label>
      <label class="switch-row"><span>Product recommendations</span><input type="checkbox" checked /><i></i></label>
      <label class="switch-row"><span>Weekly progress email</span><input type="checkbox" /><i></i></label>
    </article>
    <article class="card settings-card" data-anim="card">
      <div class="card-head"><h3>Privacy</h3></div>
      <label class="switch-row"><span>Store my scan photos privately</span><input type="checkbox" checked /><i></i></label>
      <label class="switch-row"><span>Use my scans to improve the model</span><input type="checkbox" /><i></i></label>
      <button class="btn-danger" type="button" data-toast="All data would be deleted (demo only).">Delete all my data</button>
    </article>
  </div>
</section>
