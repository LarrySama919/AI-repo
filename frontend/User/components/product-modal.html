<div class="pm-overlay" id="product-modal" aria-hidden="true">
  <div class="pm-panel">
    <div class="pm-media">
      <span class="pm-emoji" id="pm-emoji">🧴</span>
      <span class="pill pill-match pm-match" id="pm-match">92% match</span>
    </div>

    <div class="pm-info">
      <div class="pm-head">
        <h2 id="pm-name">Hydra Barrier Cream</h2>
        <strong class="pm-price" id="pm-price">$24.00</strong>
      </div>
      <p class="pm-desc" id="pm-desc">Ceramide-rich cream for dry, compromised barriers.</p>
      <div class="pm-rating">
        <span class="rec-stars" id="pm-stars">★★★★★ <em>4.8</em></span>
        <small id="pm-count">1,284 reviews</small>
      </div>

      <div class="pm-write">
        <h3>Rate this product</h3>
        <div class="star-input" id="pm-star-input">
          <button type="button" data-star="1" aria-label="1 star">★</button>
          <button type="button" data-star="2" aria-label="2 stars">★</button>
          <button type="button" data-star="3" aria-label="3 stars">★</button>
          <button type="button" data-star="4" aria-label="4 stars">★</button>
          <button type="button" data-star="5" aria-label="5 stars">★</button>
        </div>
        <textarea id="pm-text" rows="2" placeholder="How did it work for your skin?"></textarea>
        <button class="btn-primary" id="pm-submit" type="button">Submit review</button>
      </div>

      <div class="pm-reviews">
        <h3>Other reviews</h3>
        <div class="review-list" id="pm-review-list"></div>
      </div>
    </div>
  </div>
</div>
