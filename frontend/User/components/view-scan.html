<section class="view" id="view-scan">
  <div class="view-head">
    <div>
      <p class="eyebrow"><span class="eyebrow-dot"></span> AI Analysis</p>
      <h1>Choose your <em>analysis.</em></h1>
      <p class="lede">Upload a photo or take one with your camera. Your image is analyzed by the connected skin model.</p>
    </div>
  </div>
  <div class="scan-launch">
    <button class="launch-card" data-open-scan="skincare" data-anim="card">
      <span class="launch-art"><img src="assets/face-scan.png" alt="Face illustration" /></span>
      <h3>Skin care &amp; cosmetic analysis</h3>
      <p>Classifies broad facial image labels including blackheads, dark spots and pigmentation. Pigmentation is not a melasma-specific diagnosis; product reviews are available in the Products section.</p>
      <span class="launch-cta">Begin →</span>
    </button>
    <button class="launch-card" data-open-scan="condition" data-anim="card">
      <span class="launch-art"><img src="assets/body-scan.png" alt="Body illustration" /></span>
      <h3>Skin condition &amp; risk assessment</h3>
      <p>For a lesion, rash or irritated area. Concerning model signals show a care notice and withhold product suggestions.</p>
      <span class="launch-cta">Begin →</span>
    </button>
  </div>
  <p class="sample-link">AI image results are informational and cannot diagnose skin disease. Seek a clinician for changing, bleeding, painful or concerning spots.</p>
</section>
