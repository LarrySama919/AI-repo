<section class="view" id="view-scan">
  <div class="view-head">
    <div>
      <p class="eyebrow"><span class="eyebrow-dot"></span> AI Analysis</p>
      <h1>Start a new <em>scan.</em></h1>
      <p class="lede">Pick a scan type. The whole flow takes about two minutes.</p>
    </div>
  </div>
  <div class="scan-launch">
    <button class="launch-card" data-open-scan="facial" data-anim="card">
      <span class="launch-art"><img src="assets/face-scan.png" alt="Face illustration" /></span>
      <h3>Facial Scan</h3>
      <p>Full-face analysis for clarity, hydration and texture.</p>
      <span class="launch-cta">Begin →</span>
    </button>
    <button class="launch-card" data-open-scan="body" data-anim="card">
      <span class="launch-art"><img src="assets/body-scan.png" alt="Body illustration" /></span>
      <h3>Body Scan</h3>
      <p>Targeted check for rashes, spots or irritation anywhere else.</p>
      <span class="launch-cta">Begin →</span>
    </button>
  </div>
  <ol class="flow-steps" data-anim="cards">
    <li><i>1</i> Upload photo</li>
    <li><i>2</i> Answer questions</li>
    <li><i>3</i> AI processes</li>
    <li><i>4</i> Get your report</li>
  </ol>
  <p class="sample-link"><a href="#sample-report" id="sample-report-link">Just exploring? View a sample report →</a></p>
</section>
