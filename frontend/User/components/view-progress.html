<section class="view" id="view-progress">
  <div class="view-head">
    <div>
      <p class="eyebrow"><span class="eyebrow-dot"></span> Progress tracker</p>
      <h1>Your skin is <em>trending up.</em></h1>
      <p class="lede">+12 points since your first scan on Oct 26.</p>
    </div>
  </div>
  <div class="progress-grid">
    <article class="card card-bars" data-anim="card">
      <div class="card-head"><h3>Skin score over time</h3></div>
      <div class="bars">
        <div class="bar-col"><span class="bar" data-h="58%"></span><small>Oct 26</small><strong>70</strong></div>
        <div class="bar-col"><span class="bar" data-h="63%"></span><small>Nov 2</small><strong>76</strong></div>
        <div class="bar-col"><span class="bar" data-h="61%"></span><small>Nov 5</small><strong>74</strong></div>
        <div class="bar-col"><span class="bar" data-h="68%"></span><small>Nov 8</small><strong>82</strong></div>
      </div>
    </article>
    <article class="card card-metrics" data-anim="card">
      <div class="card-head"><h3>Metric breakdown</h3></div>
      <ul class="metric-list">
        <li>
          <span class="metric-name">Hydration</span>
          <span class="metric-track"><span class="metric-fill" data-w="78%" style="--c:#324f43"></span></span>
          <span class="metric-val count" data-count="78" data-suffix="%">0</span>
        </li>
        <li>
          <span class="metric-name">Clarity</span>
          <span class="metric-track"><span class="metric-fill" data-w="85%" style="--c:#cc795f"></span></span>
          <span class="metric-val count" data-count="85" data-suffix="%">0</span>
        </li>
        <li>
          <span class="metric-name">Texture</span>
          <span class="metric-track"><span class="metric-fill" data-w="80%" style="--c:#8a9c83"></span></span>
          <span class="metric-val count" data-count="80" data-suffix="%">0</span>
        </li>
        <li>
          <span class="metric-name">Redness (lower = better)</span>
          <span class="metric-track"><span class="metric-fill" data-w="22%" style="--c:#b65f4a"></span></span>
          <span class="metric-val count" data-count="22" data-suffix="%">0</span>
        </li>
      </ul>
    </article>
  </div>
</section>
